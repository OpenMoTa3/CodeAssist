name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CI_CORE_ONLY: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build desktop
      run: ./gradlew :ide-desktop:run
    - name: Build android
      run: ./gradlew :ide-android:assembleDebug
    - name: Upload project
      uses: actions/upload-artifact@v4
      with:
        name: project
        path: .
