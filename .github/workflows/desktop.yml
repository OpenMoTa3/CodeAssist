name: Build Desktop for pmOS (Linux ARM64)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 支持网页端手动点击触发构建

jobs:
  build:
    # 直接使用 GitHub 官方原生 64位 ARM Runner
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Compose Desktop 打包必须使用 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 执行原生 ARM64 桌面绿色版打包
      - name: Build Desktop Distributable
        run: ./gradlew :desktop:createDistributable

      # 将生成的 ARM64 独立运行包压缩并导出
      - name: Package Tarball
        run: |
          cd desktop/build/compose/binaries/main/app/
          tar -czvf ${{ github.workspace }}/CodeAssist-Linux-arm64.tar.gz *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeAssist-Linux-arm64
          path: CodeAssist-Linux-arm64.tar.gz
