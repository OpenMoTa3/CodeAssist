name: Build Pure Musl Desktop for pmOS (ARM64)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-musl:
    runs-on: ubuntu-24.04-arm

    # 直接在原生 Alpine Linux (musl) 容器内执行全套编译
    container:
      image: alpine:edge

    steps:
      - name: Install Alpine Native Build Dependencies
        run: |
          apk update
          # 安装 Alpine 原生 musl JDK 17 及桌面构建依赖
          apk add openjdk17-jdk git bash binutils fakeroot dpkg libx11-dev libxext-dev libxrender-dev libxtst-dev libxi-dev

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 使用 Alpine 原生 musl JDK 进行 jpackage 裁剪与打包
      - name: Build Pure Musl Distributable
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk
        run: |
          ./gradlew :app:ide-desktop:createDistributable -Pkotlin.native.ignoreDisabledTargets=true --stacktrace

      # 压缩打包纯 musl 产物
      - name: Package Tarball
        run: |
          cd app/ide-desktop/build/compose/binaries/main/app/
          tar -czvf ${{ github.workspace }}/CodeAssist-pmOS-musl-arm64.tar.gz *

      - name: Upload Musl Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeAssist-pmOS-musl-arm64
          path: CodeAssist-pmOS-musl-arm64.tar.gz
