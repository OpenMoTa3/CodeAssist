name: Build Pure Musl Desktop for pmOS (ARM64)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-pure-musl:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Native Alpine musl JDK
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            alpine:edge sh -c "
              set -e
              apk update
              apk add openjdk21-jdk git bash binutils fakeroot

              # 1. 彻底干掉强制绑定 JetBrains 的 Daemon 配置文件（核心修复）
              rm -f gradle/gradle-daemon-jvm.properties .gradle/daemon-jvm.properties
              find . -name '*daemon-jvm.properties' -delete

              # 2. 移除代码中的 Vendor 限制
              find . -type f \( -name '*.kt' -o -name '*.kts' -o -name '*.gradle' \) -exec sed -i -E \
                -e 's/JvmVendorSpec\.JETBRAINS/JvmVendorSpec.any()/g' \
                -e 's/vendor\.set\([^)]*\)//g' \
                {} + 2>/dev/null || true

              # 3. 注入系统原生 JDK 环境变量并构建
              export JAVA_HOME=/usr/lib/jvm/java-21-openjdk
              export PATH=\$JAVA_HOME/bin:\$PATH

              ./gradlew :app:ide-desktop:createDistributable \
                --no-daemon \
                -Pkotlin.native.ignoreDisabledTargets=true \
                -Porg.gradle.java.installations.auto-download=false \
                -Porg.gradle.java.installations.paths=/usr/lib/jvm/java-21-openjdk \
                --stacktrace
            "

      - name: Package Tarball
        run: |
          cd app/ide-desktop/build/compose/binaries/main/app/
          tar -czvf ${{ github.workspace }}/CodeAssist-pmOS-pure-musl-arm64.tar.gz *

      - name: Upload Pure Musl Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeAssist-pmOS-pure-musl-arm64
          path: CodeAssist-pmOS-pure-musl-arm64.tar.gz
